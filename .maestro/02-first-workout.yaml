appId: app.tapstrong
name: First workout — warm-up first, log, end, save progress
---
- runFlow: _onboard_adult.yaml
- tapOn: 'Start · .* min'
- assertVisible: 'Warm-up · .* min'
- assertVisible: 'Cool-down · .* min'
- tapOn: 'Start with warm-up'
- assertVisible: 'Warm-up'
- tapOn: 'Done'
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible: 'Done with set'
          commands:
            - tapOn: 'Done with set'
      - runFlow:
          when:
            visible: 'Skip.*'
          commands:
            - tapOn: 'Skip.*'
- tapOn: 'End workout'
- tapOn: 'Save & end'
- assertVisible: 'Your body now'
- tapOn: 'Not now'
