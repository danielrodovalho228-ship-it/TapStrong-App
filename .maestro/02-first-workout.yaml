appId: app.tapstrong
name: First workout — warm-up first, log, end, save progress
---
- runFlow: _onboard_adult.yaml
# The warm-up countdowns run and move on by themselves (Phase 27, A5).
- extendedWaitUntil:
    visible: 'Done with set'
    timeout: 600000
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible: 'Done with set'
          commands:
            - tapOn: 'Done with set'
      - runFlow:
          when:
            visible: 'Skip.*'
          commands:
            - tapOn: 'Skip.*'
- tapOn: 'End workout'
- tapOn: 'Save & end'
- assertVisible: 'Your body now'
- tapOn: 'Not now'
